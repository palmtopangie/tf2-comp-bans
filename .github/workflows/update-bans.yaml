name: Update Comp Bans

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub Actions tab

jobs:
  update-bans:
    runs-on: ubuntu-latest
    
    # Grants the workflow permissions to commit and push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run RGL bans generator
        run: python generators/generate_rglbans_list.py

      - name: Run ETF2L bans generator
        run: python generators/generate_etf2lbans_list.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update competitive ban lists [skip ci]"
          branch: main
          file_pattern: bans/*.json